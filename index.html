<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Guide</title>
    <!-- 고급스러운 명조체와 깔끔한 고딕체 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* 💡 PC 웹 브라우저에서 보더라도 모바일 폰 규격을 유지하도록 전체 배경 제어 */
        body {
            margin: 0;
            padding: 0;
            background-color: #eaeaea; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 💡 메인 컨테이너를 모바일 폰 규격(최대 430px)으로 가두고 중앙에 고정 */
        .main-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 430px; 
            height: 100vh;
            max-height: 932px; 
            background: linear-gradient(180deg, #e3daf5 0%, #fdf5eb 30%, #f3e6da 100%); 
            padding: 70px 24px 30px 24px; 
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0,0,0,0.08); 
        }

        .main-header {
            margin: 0;
            text-align: center;
        }
        
        .info-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 40px 0; 
        }

        .menu-grid {
display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2개씩 가로로 배치 */
    gap: 16px; /* 카드 사이 간격 */
    width: 100%;
    margin-top: 20px;
}

        /* 카드 클릭/터치 시 반응 효과 */
        .menu-card {
background: #ffffff; /* 카드 배경색(흰색) */
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    aspect-ratio: 1 / 1; /* 가로 세로 1:1 비율로 정사각형 유지 */
}
        .menu-card:active {
            transform: scale(0.95);
        }
        
        /* 우측 상단 버튼 고정 */
        .top-buttons {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 10001;
        }

        /* 🏨 공통 텍스트 전용 모달 팝업 디자인 */
        .hotel-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10003;
            backdrop-filter: blur(5px);
        }
        .hotel-modal-window {
            position: relative; 
            background: #fdfaf6;
            width: 95%; 
            max-width: 410px; 
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.18);
            font-family: 'Noto Sans KR', sans-serif;
            color: #36291e;
            animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 36px 24px 32px 24px; 
            box-sizing: border-box;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* 상단 우측에 깔끔하게 붙는 닫기 버튼 */
        .hotel-modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #a8978a;
            transition: color 0.2s ease;
        }
        .hotel-modal-close:hover {
            color: #6e5a4b;
        }
        
        .hotel-modal-title {
            margin: 0 0 14px 0;
            font-size: 22px;
            font-weight: 500;
            color: #36291e;
            padding-right: 30px; 
        }
        .hotel-modal-desc {
            font-size: 15px;
            line-height: 1.7; 
            color: #6e5a4b;
            margin: 0 0 24px 0;
        }

        /* 일반 정보(호텔/교통)용 그리드 스타일 */
        .hotel-info-grid {
            display: flex;
            flex-direction: column;
            gap: 20px; 
            border-top: 1px solid #e6ded6;
            padding-top: 24px;
        }
        .hotel-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14.5px;
            line-height: 1.5;
        }
        .hotel-info-label {
            color: #a8978a;
        }
        .hotel-info-value {
            font-weight: 500;
            text-align: right;
            color: #36291e;
        }

        /* 🗺️ 관광명소 & 맛집 공통 세로 리스트 컨테이너 */
        .attraction-list, .food-list {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #e6ded6;
            padding-top: 12px;
        }
        
        /* 카드 리스트 항목 경계선 */
        .attraction-card, .food-card {
            padding: 20px 0;
            border-bottom: 1px solid #eee5db;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .attraction-card:last-child, .food-card:last-child {
            border-bottom: none;
        }

        /* [이름  사진(들)  거리] 상단 레이아웃 */
        .attraction-top-row, .food-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .food-name {
            font-size: 16px;
            font-weight: 500;
            color: #36291e;
            flex: 1;
            padding-right: 8px;
        }
        .attraction-name {
            font-size: 16px;
            font-weight: 500;
            color: #36291e;
            flex: 1;
            padding-right: 8px;
        }
        .attraction-distance, .food-distance {
            font-size: 14px;
            font-weight: 500;
            color: #a8978a;
            white-space: nowrap;
        }

        /* 단일 이미지 박스 (관광명소용) */
        .attraction-img-wrapper {
            width: 70px;
            height: 50px;
            border-radius: 8px;
            background-color: #e6ded6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
        }
        .attraction-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🍔 맛집 전용: 대표 메뉴 사진 3개 배치용 컨테이너 */
        .food-images-container {
            display: flex;
            gap: 4px;
            margin-right: 12px;
        }
        .food-img-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            background-color: #e6ded6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .food-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🏷️ 맛집 전용: 대표 메뉴 텍스트 나열 행 */
        .food-menu-row {
            font-size: 13.5px;
            color: #7e6b5c;
            background-color: #fcf8f4;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px dashed #e6ded6;
            line-height: 1.4;
        }

        /* 지도보기 버튼 디자인 */
        .map-redirect-btn {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f4eae1;
            color: #6e5a4b;
            border: 1px solid #e6ded6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .map-redirect-btn:active {
            background-color: #e6ded6;
        }
        .map-redirect-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #6e5a4b;
            stroke-width: 2;
        }
    </style>
</head>
